name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: parrilladas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d parrilladas_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/parrilladas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e backend
      - run: ruff check backend
      - run: ruff format --check backend
      - run: pytest backend/tests
      - run: python -m pip check
      - run: python -m pip wheel --no-deps --no-build-isolation ./backend --wheel-dir /tmp/wheels
