name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-trixie
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: parrilladas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d parrilladas_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/parrilladas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e backend
      - name: Validate release version
        run: |
          python - <<'PY'
          import tomllib
          from importlib.metadata import version
          from pathlib import Path
          from packaging.version import Version
          from parrilladas import __version__

          configured = tomllib.loads(Path("backend/pyproject.toml").read_text())["project"]["version"]
          assert Version(configured) == Version(__version__) == Version(version("parrilladas"))
          print(f"Validated release {__version__}")
          PY
      - run: ruff check backend
      - run: ruff format --check backend
      - run: pytest backend/tests
      - run: python -m pip check
      - run: python -m pip wheel --no-deps --no-build-isolation ./backend --wheel-dir /tmp/wheels
      - name: Validate packaged knowledge
        run: |
          python -m pip install --no-deps --target /tmp/release-smoke /tmp/wheels/parrilladas-*.whl
          PYTHONPATH=/tmp/release-smoke python - <<'PYTHON'
          from importlib.resources import files
          from parrilladas.modules.assistant.knowledge import load_menu

          assert files("parrilladas.modules.assistant").joinpath("data/menu.json").is_file()
          assert load_menu().tenant_id == "parrilladas"
          print("Packaged approved catalog verified")
          PYTHON
