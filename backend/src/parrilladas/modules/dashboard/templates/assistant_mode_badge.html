{% if preferences and preferences.active_mode == 'guided' %}
  <span class="badge" aria-label="Modo de atención actual">Modo guiado</span>
{% elif preferences and preferences.active_mode == 'natural_language' %}
  <span class="badge" aria-label="Modo de atención actual">Lenguaje natural</span>
{% else %}
  <span class="badge muted" aria-label="Modo de atención actual">Modo sin verificar</span>
{% endif %}
